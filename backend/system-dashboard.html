<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Du Lich Tra Vinh - System Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.2em; opacity: 0.9; }
        .content { padding: 30px; }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .status-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            border-left: 5px solid #28a745;
            transition: transform 0.3s ease;
        }
        .status-card:hover { transform: translateY(-5px); }
        .status-card.error { border-left-color: #dc3545; }
        .status-card.warning { border-left-color: #ffc107; }
        .status-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .status-icon {
            font-size: 1.5em;
            margin-right: 10px;
        }
        .status-value {
            font-size: 2em;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 10px;
        }
        .status-card.error .status-value { color: #dc3545; }
        .status-card.warning .status-value { color: #ffc107; }
        .status-detail {
            color: #6c757d;
            font-size: 0.9em;
        }
        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #212529; }
        .btn-danger { background: #dc3545; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .logs {
            background: #2d3748;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .auto-refresh {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 25px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="auto-refresh">
        🔄 Auto-refresh: <span id="countdown">30</span>s
    </div>

    <div class="dashboard">
        <div class="header">
            <h1>🏛️ Du Lich Tra Vinh</h1>
            <p>System Health Dashboard</p>
        </div>

        <div class="content">
            <div class="status-grid">
                <div class="status-card" id="api-status">
                    <div class="status-title">
                        <span class="status-icon">🌐</span>
                        API Server
                    </div>
                    <div class="status-value" id="api-value">Checking...</div>
                    <div class="status-detail" id="api-detail">Loading status...</div>
                </div>

                <div class="status-card" id="db-status">
                    <div class="status-title">
                        <span class="status-icon">💾</span>
                        Database
                    </div>
                    <div class="status-value" id="db-value">Checking...</div>
                    <div class="status-detail" id="db-detail">Loading status...</div>
                </div>

                <div class="status-card" id="memory-status">
                    <div class="status-title">
                        <span class="status-icon">📊</span>
                        Memory Usage
                    </div>
                    <div class="status-value" id="memory-value">Checking...</div>
                    <div class="status-detail" id="memory-detail">Loading status...</div>
                </div>

                <div class="status-card" id="uptime-status">
                    <div class="status-title">
                        <span class="status-icon">⏱️</span>
                        Uptime
                    </div>
                    <div class="status-value" id="uptime-value">Checking...</div>
                    <div class="status-detail" id="uptime-detail">Loading status...</div>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-primary" onclick="checkHealth()">🔍 Check Health</button>
                <button class="btn btn-success" onclick="restartServer()">🔄 Restart Server</button>
                <button class="btn btn-warning" onclick="viewLogs()">📋 View Logs</button>
                <a href="http://localhost:3001/api/info" target="_blank" class="btn btn-primary">📊 API Info</a>
            </div>

            <div class="logs" id="logs">
                <div>📋 System logs will appear here...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001';
        let refreshInterval;
        let countdown = 30;

        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                updateStatus('api', 'success', 'Online', `Port: ${data.server?.port || 3001}`);
                updateStatus('db', data.database?.status === 'Connected' ? 'success' : 'error', 
                           data.database?.status || 'Unknown', 
                           `Latency: ${data.database?.latency || 'N/A'}`);
                updateStatus('memory', 'success', data.memory?.heapUsed || 'N/A', 
                           `Total: ${data.memory?.heapTotal || 'N/A'}`);
                updateStatus('uptime', 'success', data.server?.uptimeFormatted || 'N/A', 
                           `Environment: ${data.server?.environment || 'N/A'}`);
                
                addLog(`✅ Health check completed - All systems operational`);
                
            } catch (error) {
                updateStatus('api', 'error', 'Offline', error.message);
                updateStatus('db', 'error', 'Unknown', 'Cannot connect to API');
                updateStatus('memory', 'error', 'Unknown', 'Cannot connect to API');
                updateStatus('uptime', 'error', 'Unknown', 'Cannot connect to API');
                
                addLog(`❌ Health check failed: ${error.message}`);
            }
        }

        function updateStatus(type, status, value, detail) {
            const card = document.getElementById(`${type}-status`);
            const valueEl = document.getElementById(`${type}-value`);
            const detailEl = document.getElementById(`${type}-detail`);
            
            card.className = `status-card ${status}`;
            valueEl.textContent = value;
            detailEl.textContent = detail;
        }

        function addLog(message) {
            const logs = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            logs.innerHTML += `<div>[${time}] ${message}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }

        function restartServer() {
            addLog('🔄 Server restart requested (manual intervention required)');
            alert('Please restart the server manually using PM2 or the startup scripts.');
        }

        function viewLogs() {
            addLog('📋 Opening logs (check PM2 logs or server console)');
            alert('Check PM2 logs with: pm2 logs dulich-travinh-api');
        }

        function startCountdown() {
            const countdownEl = document.getElementById('countdown');
            refreshInterval = setInterval(() => {
                countdown--;
                countdownEl.textContent = countdown;
                
                if (countdown <= 0) {
                    countdown = 30;
                    checkHealth();
                }
            }, 1000);
        }

        // Initialize
        window.addEventListener('load', () => {
            checkHealth();
            startCountdown();
            addLog('🚀 System dashboard initialized');
        });
    </script>
</body>
</html>
