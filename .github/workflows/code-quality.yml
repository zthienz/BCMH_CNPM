name: 🔍 Code Quality - Tra Vinh Travel

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  # ===== SECURITY AUDIT =====
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        
    - name: 🔍 Audit backend dependencies
      run: |
        cd backend
        echo "🔍 Auditing backend dependencies..."
        npm audit --audit-level=moderate || true
        
        echo ""
        echo "📊 Dependency summary:"
        npm ls --depth=0 || true
        
    - name: 🔍 Check for hardcoded secrets
      run: |
        echo "🔍 Scanning for potential secrets..."
        
        # Check for common secret patterns
        echo "Checking for API keys..."
        grep -r -i "api[_-]key\s*[:=]\s*['\"][^'\"]*['\"]" --include="*.js" --include="*.json" --exclude-dir=node_modules . || echo "✅ No hardcoded API keys found"
        
        echo "Checking for passwords..."
        grep -r -i "password\s*[:=]\s*['\"][^'\"]*['\"]" --include="*.js" --include="*.json" --exclude-dir=node_modules . || echo "✅ No hardcoded passwords found"
        
        echo "Checking for database URLs..."
        grep -r -i "mysql://\|postgres://\|mongodb://" --include="*.js" --include="*.json" --exclude-dir=node_modules . || echo "✅ No hardcoded database URLs found"
        
        echo "✅ Security scan completed"
        
    - name: 🔍 Check file permissions
      run: |
        echo "🔍 Checking file permissions..."
        
        # Check for executable files that shouldn't be
        find . -type f -name "*.js" -executable -not -path "./node_modules/*" -not -path "./.git/*" | while read file; do
          echo "⚠️ JavaScript file with execute permission: $file"
        done || echo "✅ No suspicious executable JS files found"
        
        # Check for world-writable files
        find . -type f -perm -002 -not -path "./node_modules/*" -not -path "./.git/*" | while read file; do
          echo "⚠️ World-writable file: $file"
        done || echo "✅ No world-writable files found"

  # ===== CODE ANALYSIS =====
  code-analysis:
    name: 📊 Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        
    - name: 📊 Analyze code complexity
      run: |
        echo "📊 Analyzing code complexity..."
        
        # Count lines of code
        echo "📈 Lines of Code:"
        echo "Frontend HTML: $(find frontend -name "*.html" -exec wc -l {} + | tail -1 | awk '{print $1}')"
        echo "Frontend CSS: $(find frontend -name "*.css" -exec wc -l {} + | tail -1 | awk '{print $1}')"
        echo "Frontend JS: $(find frontend -name "*.js" -not -path "*/node_modules/*" -exec wc -l {} + | tail -1 | awk '{print $1}')"
        echo "Backend JS: $(find backend -name "*.js" -not -path "*/node_modules/*" -exec wc -l {} + | tail -1 | awk '{print $1}')"
        
        # Count files
        echo ""
        echo "📁 File Count:"
        echo "HTML files: $(find frontend -name "*.html" | wc -l)"
        echo "CSS files: $(find frontend -name "*.css" | wc -l)"
        echo "Frontend JS files: $(find frontend -name "*.js" -not -path "*/node_modules/*" | wc -l)"
        echo "Backend JS files: $(find backend -name "*.js" -not -path "*/node_modules/*" | wc -l)"
        
    - name: 🔍 Check code quality
      run: |
        echo "🔍 Checking code quality..."
        
        # Check for TODO/FIXME comments
        echo "📝 TODO/FIXME comments:"
        grep -r -n -i "todo\|fixme\|hack\|xxx" --include="*.js" --include="*.html" --include="*.css" . || echo "✅ No TODO/FIXME comments found"
        
        # Check for console.log statements
        echo ""
        echo "🐛 Console.log statements:"
        grep -r -n "console\.log" --include="*.js" --exclude-dir=node_modules . || echo "✅ No console.log statements found"
        
        # Check for long functions (basic check)
        echo ""
        echo "📏 Checking for long functions..."
        find . -name "*.js" -not -path "*/node_modules/*" -exec awk '
          /^[[:space:]]*function|^[[:space:]]*[a-zA-Z_][a-zA-Z0-9_]*[[:space:]]*\(|^[[:space:]]*[a-zA-Z_][a-zA-Z0-9_]*:[[:space:]]*function/ {
            start = NR; func_name = $0
          }
          /^[[:space:]]*}/ && start {
            if (NR - start > 50) {
              print FILENAME ":" start ": Long function (" (NR - start) " lines): " func_name
            }
            start = 0
          }
        ' {} \; || echo "✅ No excessively long functions found"

  # ===== PERFORMANCE ANALYSIS =====
  performance-analysis:
    name: ⚡ Performance Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ⚡ Analyze frontend performance
      run: |
        echo "⚡ Analyzing frontend performance..."
        
        # Check file sizes
        echo "📊 File sizes:"
        find frontend -name "*.css" -exec ls -lh {} \; | awk '{print $5 " " $9}' | sort -hr
        find frontend -name "*.js" -not -path "*/node_modules/*" -exec ls -lh {} \; | awk '{print $5 " " $9}' | sort -hr
        
        # Check for large images (if any)
        echo ""
        echo "🖼️ Image files:"
        find frontend -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.gif" -o -name "*.webp" | while read img; do
          size=$(ls -lh "$img" | awk '{print $5}')
          echo "$size $img"
        done | sort -hr || echo "ℹ️ No image files found"
        
        # Check for external dependencies
        echo ""
        echo "🔗 External dependencies in HTML:"
        grep -r -h "https\?://" --include="*.html" frontend/ | grep -E "(script|link|img)" | head -10 || echo "ℹ️ No external dependencies found"
        
    - name: 🔍 Check for optimization opportunities
      run: |
        echo "🔍 Checking for optimization opportunities..."
        
        # Check for minification opportunities
        echo "📦 Minification opportunities:"
        find frontend -name "*.css" -exec sh -c 'echo "CSS: $1 ($(wc -l < "$1") lines)"' _ {} \;
        find frontend -name "*.js" -not -path "*/node_modules/*" -exec sh -c 'echo "JS: $1 ($(wc -l < "$1") lines)"' _ {} \;
        
        # Check for duplicate code patterns
        echo ""
        echo "🔄 Checking for potential duplicate code..."
        # Simple check for repeated function names
        grep -r -h "function [a-zA-Z_][a-zA-Z0-9_]*" --include="*.js" --exclude-dir=node_modules . | sort | uniq -d | head -5 || echo "✅ No obvious duplicate functions found"

  # ===== ACCESSIBILITY CHECK =====
  accessibility-check:
    name: ♿ Accessibility Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ♿ Check HTML accessibility
      run: |
        echo "♿ Checking HTML accessibility..."
        
        # Check for alt attributes on images
        echo "🖼️ Checking image alt attributes:"
        find frontend -name "*.html" -exec grep -l "<img" {} \; | while read file; do
          echo "Checking $file..."
          if grep -q "<img[^>]*alt=" "$file"; then
            echo "✅ $file has images with alt attributes"
          else
            echo "⚠️ $file may have images without alt attributes"
          fi
        done
        
        # Check for semantic HTML elements
        echo ""
        echo "🏗️ Checking semantic HTML:"
        semantic_elements="header|nav|main|section|article|aside|footer"
        find frontend -name "*.html" -exec grep -l -E "<($semantic_elements)" {} \; | while read file; do
          echo "✅ $file uses semantic HTML elements"
        done || echo "⚠️ Consider using more semantic HTML elements"
        
        # Check for heading hierarchy
        echo ""
        echo "📝 Checking heading hierarchy:"
        find frontend -name "*.html" -exec sh -c '
          echo "Checking $1..."
          grep -o "<h[1-6]" "$1" | sort | uniq -c | sort -k2
        ' _ {} \;

  # ===== DOCUMENTATION CHECK =====
  documentation-check:
    name: 📚 Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📚 Check documentation
      run: |
        echo "📚 Checking documentation..."
        
        # Check for README files
        echo "📖 README files:"
        find . -name "README*" -not -path "./.git/*" | while read readme; do
          echo "✅ Found: $readme ($(wc -l < "$readme") lines)"
        done || echo "⚠️ No README files found"
        
        # Check for comments in code
        echo ""
        echo "💬 Code comments:"
        js_files=$(find . -name "*.js" -not -path "*/node_modules/*" | wc -l)
        commented_js=$(find . -name "*.js" -not -path "*/node_modules/*" -exec grep -l "/\*\|//" {} \; | wc -l)
        echo "JavaScript files with comments: $commented_js/$js_files"
        
        # Check for package.json descriptions
        echo ""
        echo "📦 Package descriptions:"
        find . -name "package.json" -not -path "*/node_modules/*" -exec sh -c '
          echo "Checking $1..."
          if grep -q "\"description\":" "$1"; then
            echo "✅ Has description"
          else
            echo "⚠️ Missing description"
          fi
        ' _ {} \;

  # ===== QUALITY SUMMARY =====
  quality-summary:
    name: 📊 Quality Summary
    runs-on: ubuntu-latest
    needs: [security-audit, code-analysis, performance-analysis, accessibility-check, documentation-check]
    if: always()
    
    steps:
    - name: 📊 Generate quality report
      run: |
        echo "📊 CODE QUALITY REPORT - Tra Vinh Travel"
        echo "========================================"
        echo ""
        echo "🔒 Security Audit: ${{ needs.security-audit.result }}"
        echo "📊 Code Analysis: ${{ needs.code-analysis.result }}"
        echo "⚡ Performance Analysis: ${{ needs.performance-analysis.result }}"
        echo "♿ Accessibility Check: ${{ needs.accessibility-check.result }}"
        echo "📚 Documentation Check: ${{ needs.documentation-check.result }}"
        echo ""
        
        # Calculate overall score
        passed=0
        total=5
        
        [ "${{ needs.security-audit.result }}" = "success" ] && passed=$((passed + 1))
        [ "${{ needs.code-analysis.result }}" = "success" ] && passed=$((passed + 1))
        [ "${{ needs.performance-analysis.result }}" = "success" ] && passed=$((passed + 1))
        [ "${{ needs.accessibility-check.result }}" = "success" ] && passed=$((passed + 1))
        [ "${{ needs.documentation-check.result }}" = "success" ] && passed=$((passed + 1))
        
        score=$((passed * 100 / total))
        
        echo "📈 Overall Quality Score: $score% ($passed/$total checks passed)"
        echo ""
        
        if [ $score -ge 80 ]; then
          echo "🎉 EXCELLENT code quality!"
        elif [ $score -ge 60 ]; then
          echo "👍 GOOD code quality with room for improvement"
        else
          echo "⚠️ Code quality needs attention"
        fi
        
        echo ""
        echo "🔗 View detailed results in the individual job logs above"
