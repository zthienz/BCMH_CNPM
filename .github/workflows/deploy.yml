name: 🚀 Deploy - Tra Vinh Travel

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  NODE_VERSION: '18.x'

jobs:
  # ===== BUILD =====
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'
        
    - name: 📦 Install dependencies
      run: |
        cd backend
        npm ci --production || npm install --production
        
    - name: 🏗️ Build application
      run: |
        echo "🏗️ Building Tra Vinh Travel application..."
        
        # Create build directory
        mkdir -p dist
        
        # Copy and optimize frontend files
        echo "📁 Copying frontend files..."
        cp -r frontend dist/
        
        # Remove development files from frontend
        find dist/frontend -name "*.md" -delete
        find dist/frontend -name "test-*" -delete
        find dist/frontend -name "debug-*" -delete
        
        # Copy backend files
        echo "📁 Copying backend files..."
        cp -r backend dist/
        
        # Clean up backend development files
        rm -rf dist/backend/node_modules
        find dist/backend -name "test-*" -delete
        find dist/backend -name "*.test.js" -delete
        find dist/backend -name "*.spec.js" -delete
        
        # Install production dependencies
        cd dist/backend
        npm ci --production --silent || npm install --production --silent
        
        # Create version info
        echo "📝 Creating version info..."
        cat > dist/version.json << EOF
        {
          "version": "${GITHUB_SHA:0:7}",
          "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "branch": "${GITHUB_REF_NAME}",
          "commit": "${GITHUB_SHA}"
        }
        EOF
        
        echo "✅ Build completed successfully!"
        
    - name: 📊 Build statistics
      run: |
        echo "📊 BUILD STATISTICS"
        echo "==================="
        echo "📁 Frontend files: $(find dist/frontend -type f | wc -l)"
        echo "📁 Backend files: $(find dist/backend -type f -not -path "*/node_modules/*" | wc -l)"
        echo "📦 Node modules: $(find dist/backend/node_modules -type f | wc -l)"
        echo "💾 Total size: $(du -sh dist | cut -f1)"
        echo "💾 Frontend size: $(du -sh dist/frontend | cut -f1)"
        echo "💾 Backend size: $(du -sh dist/backend | cut -f1)"
        
    - name: 📦 Create deployment package
      run: |
        echo "📦 Creating deployment package..."
        cd dist
        tar -czf ../travinh-travel-${{ github.sha }}.tar.gz .
        cd ..
        echo "✅ Package created: travinh-travel-${{ github.sha }}.tar.gz"
        ls -lh travinh-travel-*.tar.gz
        
    - name: 💾 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: travinh-travel-build-${{ github.sha }}
        path: |
          dist/
          travinh-travel-${{ github.sha }}.tar.gz
        retention-days: 30

  # ===== DEPLOY TO STAGING =====
  deploy-staging:
    name: 🧪 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment: staging
    
    steps:
    - name: 📥 Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: travinh-travel-build-${{ github.sha }}
        
    - name: 🚀 Deploy to staging
      run: |
        echo "🧪 Deploying to STAGING environment..."
        echo "📦 Package: travinh-travel-${{ github.sha }}.tar.gz"
        
        # Simulate deployment process
        echo "🔧 Extracting package..."
        tar -xzf travinh-travel-${{ github.sha }}.tar.gz -C staging-deploy || mkdir -p staging-deploy && tar -xzf travinh-travel-${{ github.sha }}.tar.gz -C staging-deploy
        
        echo "🔧 Setting up staging environment..."
        # Here you would typically:
        # - Upload files to staging server
        # - Update environment variables
        # - Restart services
        # - Run database migrations
        
        echo "✅ Staging deployment completed!"
        echo "🌐 Staging URL: https://staging.travinh-travel.com"
        
    - name: 🧪 Run staging tests
      run: |
        echo "🧪 Running staging tests..."
        
        # Simulate staging tests
        echo "✅ Frontend accessibility test: PASSED"
        echo "✅ Backend health check: PASSED"
        echo "✅ Database connectivity: PASSED"
        echo "✅ API endpoints: PASSED"
        
        echo "🎉 All staging tests passed!"

  # ===== DEPLOY TO PRODUCTION =====
  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment: production
    
    steps:
    - name: 📥 Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: travinh-travel-build-${{ github.sha }}
        
    - name: 🌟 Deploy to production
      run: |
        echo "🌟 Deploying to PRODUCTION environment..."
        echo "📦 Package: travinh-travel-${{ github.sha }}.tar.gz"
        
        # Simulate production deployment
        echo "🔧 Extracting package..."
        tar -xzf travinh-travel-${{ github.sha }}.tar.gz -C production-deploy || mkdir -p production-deploy && tar -xzf travinh-travel-${{ github.sha }}.tar.gz -C production-deploy
        
        echo "🔧 Setting up production environment..."
        # Here you would typically:
        # - Upload files to production server
        # - Update environment variables
        # - Restart services with zero downtime
        # - Run database migrations
        # - Update CDN cache
        
        echo "✅ Production deployment completed!"
        echo "🌐 Production URL: https://travinh-travel.com"
        
    - name: 🔍 Production health check
      run: |
        echo "🔍 Running production health checks..."
        
        # Simulate production health checks
        echo "✅ Frontend loading: PASSED"
        echo "✅ Backend API: PASSED"
        echo "✅ Database: PASSED"
        echo "✅ SSL certificate: PASSED"
        echo "✅ CDN: PASSED"
        
        echo "🎉 All production health checks passed!"

  # ===== NOTIFICATION =====
  notify:
    name: 📢 Deployment Notification
    runs-on: ubuntu-latest
    needs: [build, deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: 📢 Success notification
      if: needs.build.result == 'success'
      run: |
        echo "🎉 DEPLOYMENT SUCCESS!"
        echo "======================"
        echo ""
        echo "✅ Build: ${{ needs.build.result }}"
        echo "✅ Staging: ${{ needs.deploy-staging.result }}"
        echo "✅ Production: ${{ needs.deploy-production.result }}"
        echo ""
        echo "🌐 Tra Vinh Travel is now live!"
        echo "📱 Frontend: Deployed successfully"
        echo "🔧 Backend: API services running"
        echo "🗄️ Database: Connected and operational"
        echo ""
        echo "🔗 Links:"
        if [ "${{ needs.deploy-staging.result }}" = "success" ]; then
          echo "🧪 Staging: https://staging.travinh-travel.com"
        fi
        if [ "${{ needs.deploy-production.result }}" = "success" ]; then
          echo "🌟 Production: https://travinh-travel.com"
        fi
        
    - name: ❌ Failure notification
      if: needs.build.result == 'failure' || needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure'
      run: |
        echo "❌ DEPLOYMENT FAILED!"
        echo "===================="
        echo ""
        echo "Build: ${{ needs.build.result }}"
        echo "Staging: ${{ needs.deploy-staging.result }}"
        echo "Production: ${{ needs.deploy-production.result }}"
        echo ""
        echo "🔧 Please check the logs and fix the issues before retrying."
        echo "📧 Development team has been notified."

  # ===== ROLLBACK (Manual) =====
  rollback:
    name: 🔄 Rollback (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'rollback'
    
    steps:
    - name: 🔄 Rollback deployment
      run: |
        echo "🔄 ROLLBACK INITIATED"
        echo "===================="
        echo ""
        echo "⚠️ Rolling back to previous version..."
        echo "🔧 This would typically:"
        echo "   - Restore previous application version"
        echo "   - Revert database changes if needed"
        echo "   - Clear CDN cache"
        echo "   - Notify monitoring systems"
        echo ""
        echo "✅ Rollback completed successfully!"
        echo "🌐 Previous version is now active"
